name: Prévias das wikis

# Roda manualmente (aba Actions → "Prévias das wikis" → Run workflow).
# As máquinas do GitHub têm acesso às wikis, então a busca roda aqui.
#   modo "diagnostico": mostra o que as wikis devolvem (não altera nada)
#   modo "testar":      mostra quais imagens seriam associadas (não altera nada)
#   modo "gravar":      grava as imagens na base, publica e atualiza o site
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'diagnostico, testar ou gravar'
        type: choice
        options: [diagnostico, testar, gravar]
        default: testar
      lancamentos:
        description: 'IDs dos lançamentos separados por espaço (vazio = todos)'
        required: false
        default: ''
      aproximadas:
        description: 'Também gravar prévias aproximadas (≈)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Diagnóstico
        if: inputs.modo == 'diagnostico'
        run: node scripts/wiki-probe.mjs ${{ inputs.lancamentos }}

      - uses: actions/upload-artifact@v4
        if: inputs.modo == 'diagnostico'
        with:
          name: wiki-probe
          path: wiki-probe.json

      - name: Buscar prévias
        if: inputs.modo != 'diagnostico'
        run: |
          FLAGS="--verbose"
          [ "${{ inputs.modo }}" = "testar" ] && FLAGS="$FLAGS --dry"
          [ "${{ inputs.aproximadas }}" = "true" ] && FLAGS="$FLAGS --approx"
          node scripts/fetch-images.mjs ${{ inputs.lancamentos }} $FLAGS

      - name: Publicar base atualizada
        if: inputs.modo == 'gravar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/photocards.json; then
            echo "Nenhuma imagem nova — nada a publicar."
            exit 0
          fi
          npm run data:bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/photocards.json
          git commit -m "data: prévias das wikis ($(node -p "require('./public/data/photocards.json').dataVersion"))"
          git push origin HEAD:main
          # Commits feitos pelo Actions não disparam outros workflows: publica o site manualmente
          gh workflow run deploy.yml --ref main
