name: Prévias das wikis

# Coleta as imagens das wikis (prévias das versões e fotos de divulgação dos
# membros) e grava na base. As máquinas do GitHub têm acesso às wikis.
#   - Automático: toda segunda-feira, no modo "gravar" (pega lançamentos novos).
#   - Manual: aba Actions → "Prévias das wikis" → Run workflow.
#       diagnostico: mostra o que as wikis têm (não altera nada)
#       testar:      mostra o que seria gravado (não altera nada)
#       gravar:      grava na base, publica a base e atualiza o site
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      modo:
        description: 'diagnostico, testar ou gravar'
        type: choice
        options: [diagnostico, testar, gravar]
        default: testar
      lancamentos:
        description: 'IDs dos lançamentos separados por espaço (vazio = todos)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      MODO: ${{ inputs.modo || 'gravar' }}
      IDS: ${{ inputs.lancamentos || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Diagnóstico
        if: env.MODO == 'diagnostico'
        run: node scripts/wiki-probe.mjs $IDS

      - name: Buscar imagens
        if: env.MODO != 'diagnostico'
        run: |
          FLAGS="--verbose"
          [ "$MODO" = "testar" ] && FLAGS="$FLAGS --dry"
          node scripts/fetch-images.mjs $IDS $FLAGS

      - name: Publicar base atualizada
        if: env.MODO == 'gravar'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/photocards.json; then
            echo "Nenhuma imagem nova — nada a publicar."
            exit 0
          fi
          npm run data:bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/photocards.json
          git commit -m "data: imagens das wikis ($(node -p "require('./public/data/photocards.json').dataVersion"))"
          git pull --rebase origin main
          git push origin HEAD:main
          # Commits feitos pelo Actions não disparam outros workflows: publica o site manualmente
          gh workflow run deploy.yml --ref main
